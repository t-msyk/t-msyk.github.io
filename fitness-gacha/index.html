<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日のクエストガチャ</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#10131a;
    color:white;
    text-align:center;
}

.container{
    max-width:800px;
    margin:auto;
    padding:20px;
}

h1{
    font-size:2em;
}

.stats{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin:20px 0;
}

.card{
    background:#1d2330;
    padding:12px;
    border-radius:12px;
    min-width:120px;
}

button{
    font-size:1.5em;
    padding:20px 40px;
    border:none;
    border-radius:16px;
    background:#ffb300;
    cursor:pointer;
    box-shadow:0 0 20px #ffb300;
}

button:hover{
    transform:scale(1.05);
}

#result{
    margin-top:30px;
    min-height:140px;
}

.rarity{
    font-size:2em;
    font-weight:bold;
}

.quest{
    font-size:1.4em;
    margin-top:10px;
}

.ssr{
    color:#ffd700;
    text-shadow:0 0 20px gold;
}

.sr{
    color:#66ccff;
}

.r{
    color:#99ff99;
}

.n{
    color:#dddddd;
}

.spin{
    animation:spin 0.08s linear infinite;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

.completeBar{
    margin-top:30px;
}

progress{
    width:80%;
    height:25px;
}
</style>
</head>

<body>

<div class="container">

<h1>&#x1f3b0; 今日のクエストガチャ &#x1f3b0;</h1>

<div class="stats">
<div class="card">
<div>総ガチャ</div>
<div id="drawCount">0</div>
</div>

<div class="card">
<div>継続日数</div>
<div id="streak">0</div>
</div>

<div class="card">
<div>図鑑</div>
<div id="collection">0%</div>
</div>
</div>

<button onclick="drawGacha()">ガチャを回す</button>

<div id="result"></div>

<div class="completeBar">
<progress id="progress" max="7" value="0"></progress>
</div>

</div>

<script>

const items = [

{ id:1, rarity:"SSR", rate:1, task:"&#x1f451; 王様の休日\n今日は休み", cls:"ssr" },

{ id:2, rarity:"SSR", rate:1, task:"&#x1f308; フルコンボ\nラジオ体操 第一＋第二", cls:"ssr" },

{ id:3, rarity:"SSR", rate:1, task:"&#x1f48e; 足やせスペシャル\nラジオ体操第一＋むぎゅむぎゅ10分", cls:"ssr" },

{ id:4, rarity:"SSR", rate:1, task:"&#x1f3ab; クエスト選択券\n好きなクエストを選べる", cls:"ssr" },

{ id:5, rarity:"SR", rate:4, task:"ラジオ体操 第一", cls:"sr" },

{ id:6, rarity:"SR", rate:4, task:"ラジオ体操 第二", cls:"sr" },

{ id:7, rarity:"SR", rate:4, task:"むぎゅむぎゅ10分", cls:"sr" },

{ id:8, rarity:"SR", rate:4, task:"ストレッチ10分", cls:"sr" },

{ id:9, rarity:"SR", rate:4, task:"肩回し50回", cls:"sr" },

{ id:10, rarity:"SR", rate:4, task:"その場足踏み5分", cls:"sr" },

{ id:11, rarity:"SR", rate:4, task:"お部屋ウォーク5分", cls:"sr" },

{ id:12, rarity:"SR", rate:4, task:"肩回し20回＋ストレッチ5分", cls:"sr" },

{ id:13, rarity:"R", rate:6, task:"むぎゅむぎゅ5分", cls:"r" },

{ id:14, rarity:"R", rate:6, task:"むぎゅむぎゅ3分", cls:"r" },

{ id:15, rarity:"R", rate:6, task:"肩回し20回", cls:"r" },

{ id:16, rarity:"R", rate:6, task:"首ストレッチ2分", cls:"r" },

{ id:17, rarity:"R", rate:6, task:"足首ぐるぐる左右20回", cls:"r" },

{ id:18, rarity:"R", rate:6, task:"前屈30秒", cls:"r" },

{ id:19, rarity:"R", rate:6, task:"背伸び20秒×3", cls:"r" },

{ id:20, rarity:"R", rate:6, task:"深呼吸20回", cls:"r" },

{ id:21, rarity:"R", rate:6, task:"姿勢リセット3分", cls:"r" },

{ id:22, rarity:"R", rate:6, task:"立ってテレビを見る5分", cls:"r" },

{ id:23, rarity:"N", rate:8, task:"水を1杯飲む", cls:"n" },

{ id:24, rarity:"N", rate:8, task:"麦茶を飲む", cls:"n" },

{ id:25, rarity:"N", rate:8, task:"窓を開けて背伸び", cls:"n" },

{ id:26, rarity:"N", rate:8, task:"1分だけ外の空気を吸う", cls:"n" },

{ id:27, rarity:"N", rate:8, task:"お菓子を1個我慢", cls:"n" },

{ id:28, rarity:"N", rate:8, task:"3分だけ片付け", cls:"n" },

{ id:29, rarity:"N", rate:8, task:"今日はスタンプだけ押してOK", cls:"n" },

{ id:30, rarity:"N", rate:8, task:"夫に『よくできました』を言わせる", cls:"n" }

];


let drawCount =
Number(localStorage.getItem("drawCount") || 0);

let collection =
JSON.parse(localStorage.getItem("collection") || "[]");

let streak =
Number(localStorage.getItem("streak") || 0);

updateUI();

function pickItem(){

    let r = Math.random() * 100;
    let total = 0;

    for(let item of items){
        total += item.rate;

        if(r < total){
            return item;
        }
    }
}

function drawGacha(){

    const button = document.querySelector("button");

    button.disabled = true;
    button.classList.add("spin");

    let count = 0;

    const interval = setInterval(()=>{

        const item =
        items[Math.floor(Math.random()*items.length)];

        document.getElementById("result").innerHTML =
        `<div class="rarity ${item.cls}">
        ${item.rarity}
        </div>
        <div class="quest">${item.task}</div>`;

        count++;

        if(count > 25){

            clearInterval(interval);

            const result = pickItem();

            drawCount++;

            localStorage.setItem(
                "drawCount",
                drawCount
            );

            if(!collection.includes(result.task)){
                collection.push(result.task);

                localStorage.setItem(
                    "collection",
                    JSON.stringify(collection)
                );
            }

            updateStreak();

            document.getElementById("result").innerHTML =
            `<div class="rarity ${result.cls}">
            ${result.rarity}
            </div>
            <div class="quest">
            ${result.task}
            </div>`;

            button.disabled = false;
            button.classList.remove("spin");

            updateUI();

            if(result.rarity === "SSR"){
                alert("✨ SSR!! 超レアクエスト獲得！ ✨");
            }

        }

    },100);
}

function updateStreak(){

    const today =
    new Date().toISOString().slice(0,10);

    const last =
    localStorage.getItem("lastDate");

    if(last !== today){

        streak++;

        localStorage.setItem(
            "streak",
            streak
        );

        localStorage.setItem(
            "lastDate",
            today
        );
    }
}

function updateUI(){

    document.getElementById("drawCount")
        .textContent = drawCount;

    document.getElementById("streak")
        .textContent = streak;

    const percent =
    Math.round(collection.length / items.length * 100);

    document.getElementById("collection")
        .textContent = percent + "%";

    document.getElementById("progress")
        .value = collection.length;
}

</script>

</body>
</html>
